version: '3.8'
services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - OPENAI_API_KEY=
      - DATABASE_NAME=hr_intelligent
      - DATABASE_HOST=db
      - DATABASE_PASSWORD=password
      - DATABASE_USERNAME=user
      - DATABASE_PORT=3306
      - OPENAI_MODEL=gpt-3.5-turbo
    depends_on:
      - db
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hr_intelligent
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mysqldata:
